<html>
<head>
    <title>DA COOLEST NOTES</title>
    <style>
        body {
            background-color: white;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: url('/backgrounds/image/guy-arguing.gif');
            background-repeat: no-repeat;
            background-size: cover;
            background-color:beige;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <h1>WE DA COOLEST PAGE</h1>
    
    <a href="/posts/new">New</a> <br><br>
    
    {% for post in posts %}
    <h2>
        <a href="/posts/{{ post.slug }}">
            {{ post.title }}
        </a>
    </h2>
    
    <p>{{ post.created }}</p>
    
    {% endfor %}
    
    <a href="/?page={{ page - 1}}">Last Page</a><br><br>
    <a href="/?page={{ page + 1 }}">Next Page</a>
</body>
</html>
